name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-and-test:
    name: Typecheck & Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      # npm ci installs the lock verbatim: npm >= 11 'npm install' silently
      # re-resolves platform packages missing from the lock, so only npm ci
      # fails loudly on a broken or out-of-sync lockfile.
      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
